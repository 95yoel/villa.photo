<main class="not-found-shell">
  <section class="not-found-panel" aria-labelledby="not-found-title">
    <p class="section-kicker">404</p>
    <h1 id="not-found-title">El recurso que buscas no existe.</h1>
    <p class="not-found-copy">
      Te llevaremos a la página principal en {{ secondsRemaining }} segundos.
    </p>

    <button type="button" class="home-button" (click)="goHome()">
      Volver ahora
    </button>
  </section>
</main>
