<div class="viewer-backdrop" (click)="onBackdropClick()">
  <section class="viewer-shell" (click)="$event.stopPropagation()" aria-modal="true" role="dialog">
    <button type="button" class="viewer-close" (click)="onCloseClick()" aria-label="Cerrar imagen">
      X
    </button>

    <div
      class="viewer-media"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
      [style.--photo-placeholder]="getPhotoPlaceholder(photo())"
    >
      <div
        class="viewer-placeholder"
        [class.is-hidden]="isPhotoLoaded(photo())"
        aria-hidden="true"
      ></div>
      <img
        [src]="photo().src"
        [alt]="photo().alt"
        [attr.width]="photo().width"
        [attr.height]="photo().height"
        decoding="async"
        fetchpriority="high"
        [class.is-loaded]="isPhotoLoaded(photo())"
        (load)="onImageLoad(photo())"
      />
    </div>

    <div class="viewer-controls" aria-label="Navegacion de imagenes">
      <button
        type="button"
        class="viewer-nav"
        (click)="onPreviousClick()"
        aria-label="Ver imagen anterior"
      >
        &lt;
      </button>

      <button
        type="button"
        class="viewer-nav"
        (click)="onNextClick()"
        aria-label="Ver imagen siguiente"
      >
        &gt;
      </button>
    </div>

    <div class="viewer-meta">
      <div class="viewer-meta-text">
        <h2>{{ photo().title }}</h2>
        <p>{{ photo().location }}</p>
      </div>
    </div>
  </section>
</div>
