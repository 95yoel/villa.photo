<div class="viewer-backdrop" (click)="onBackdropClick()">
  <section class="viewer-shell" (click)="$event.stopPropagation()" aria-modal="true" role="dialog">
    <div class="viewer-actions">
      <button type="button" class="viewer-action" (click)="onCloseClick()" aria-label="Cerrar imagen">
        X
      </button>

      <button
        type="button"
        class="viewer-action"
        [class.is-active]="shareState !== 'idle'"
        (click)="onShareClick()"
        [attr.aria-label]="shareState === 'copied' ? 'Enlace copiado' : 'Compartir imagen'"
      >
        @if (shareState === 'copied') {
          OK
        } @else if (shareState === 'failed') {
          !
        } @else {
          &#x2197;
        }
      </button>
    </div>

    <div
      class="viewer-media"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
      [style.--photo-placeholder]="getPhotoPlaceholder(photo())"
    >
      <div
        class="viewer-placeholder"
        [class.is-hidden]="isPhotoLoaded(photo())"
        aria-hidden="true"
      ></div>
      <img
        [src]="photo().src"
        [alt]="photo().alt"
        [attr.width]="photo().width"
        [attr.height]="photo().height"
        decoding="async"
        fetchpriority="high"
        [class.is-loaded]="isPhotoLoaded(photo())"
        (load)="onImageLoad(photo())"
      />
    </div>

    <div class="viewer-controls" aria-label="Navegación de imágenes">
      @if (hasPrevious()) {
        <button
          type="button"
          class="viewer-nav"
          (click)="onPreviousClick()"
          aria-label="Ver imagen anterior"
        >
          &lt;
        </button>
      } @else {
        <span class="viewer-nav-spacer" aria-hidden="true"></span>
      }

      @if (total() > 0) {
        <span class="viewer-counter" [attr.aria-label]="'Imagen ' + position() + ' de ' + total()">
          {{ position() }} / {{ total() }}
        </span>
      }

      @if (hasNext()) {
        <button
          type="button"
          class="viewer-nav"
          (click)="onNextClick()"
          aria-label="Ver imagen siguiente"
        >
          &gt;
        </button>
      } @else {
        <span class="viewer-nav-spacer" aria-hidden="true"></span>
      }
    </div>

    <div class="viewer-meta">
      <div class="viewer-meta-text">
        <h2>{{ photo().title }}</h2>
        <p>{{ photo().location }}</p>
      </div>
    </div>
  </section>
</div>
